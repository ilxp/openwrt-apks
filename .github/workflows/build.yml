name: Build APKs (Dynamic Fetch & SDK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. 临时拉取源码
      # ============================================================
      - name: Fetch Source Code
        run: |
          chmod +x scripts/fetch-src.sh
          ./scripts/fetch-src.sh

      # ============================================================
      # 2. 源码归位（重要！）
      # ============================================================
      - name: Prepare Source for SDK Action
        run: |
          # 1. 先把所有源码移到根目录
          mv package/custom/* ./ || true
          rm -rf package

          # 2. 特殊处理 honk 的嵌套目录
          if [ -d "luci-app-honk" ]; then
              echo "发现 luci-app-honk 目录，正在展平结构..."
              # 把核心程序和界面文件夹提取到根目录
              mv luci-app-honk/honk ./honk || true
              mv luci-app-honk/luci-app-honk ./luci-app-honk-ui || true
              # 如果内部也叫 luci-app-honk，先改名避免冲突，再处理
              if [ -d "luci-app-honk-ui" ]; then
                  mv luci-app-honk-ui ./luci-app-honk
              fi
              # 删除空壳文件夹
              rm -rf luci-app-honk
          fi

          # 打印一下当前根目录，确认 honk 和 luci-app-honk 已经出来了
          ls -la

      # ============================================================
      # 3. 调用 Docker SDK Action 进行极速编译
      # ============================================================
      - name: Build Packages via Docker
        # 🚨 换成你 fork 的仓库
        uses: ilxp/openwrt-gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          # 填你需要编译的包名，以 Makefile 里的 PKG_NAME 为准
          PACKAGES: "honk luci-app-honk luci-app-controlplus admask onup luci-app-qosmate qosmate luci-app-podman luci-theme-argon openwrt-clashoo luci-app-mosdns"
          #PACKAGES: "honk"  # 先只测试这一个包
          NO_REFRESH_CHECK: true
          # 如果有需要，这里可以开详细日志
          IGNORE_ERRORS: true # 忽略错误
          V: s # 开启详细日志，寻找 exit code 2 的真正原因

      # ============================================================
      # 4. 打包产物并发布
      # ============================================================
      - name: Create compress files
        run: |
          # sbwml 的 Action 编译后，产物会在 bin/packages/x86_64/ 下
          ls -la bin/packages/x86_64/
          tar -zcvf OprX-Packages-x86_64.tar.gz -C bin/packages/x86_64/ packages_ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OprX-Packages-x86_64
          path: "OprX-Packages-x86_64.tar.gz"

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "x86-64-apks-v2"
          name: "OprX 专属库 (x86_64)-2"
          files: OprX-Packages-x86_64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true
