name: Build APKs (Dynamic Fetch & Matrix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.group }} Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 将极慢的包单独拆出来，并行跑
          - group: "clashoo"
            pkg_match: "clashoo"
          - group: "openlist2"
            pkg_match: "openlist2"
          # 剩下的所有包放一组
          - group: "others"
            pkg_match: "others"
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. 临时拉取源码
      # ============================================================
      - name: Fetch Source Code
        run: |
          chmod +x scripts/fetch-src.sh
          ./scripts/fetch-src.sh

      # ============================================================
      # 2. 源码归位 & 智能递归展平
      # ============================================================
      - name: Prepare Source for SDK Action
        run: |
          mv package/custom/* ./ || true
          rm -rf package
          
          # 智能递归展平
          for dir in */; do
              dir=${dir%/}
              # 如果这个目录自己就是个包，跳过
              if [ -f "$dir/Makefile" ]; then
                  continue
              fi
              
              # 如果没有 Makefile，但里面有包含 Makefile 的子目录，把子目录提出来！
              extracted=0
              for subdir in "$dir"/*/; do
                  subdir=${subdir%/}
                  if [ -f "$subdir/Makefile" ]; then
                      echo "展平提取: $subdir -> ./"
                      mv "$subdir" ./
                      extracted=1
                  fi
              done
              
              # 如果提取过，或者本来就是空壳，删掉外层
              if [ "$extracted" -eq 1 ] || [ ! "$(ls -A "$dir")" ]; then
                  rm -rf "$dir"
              fi
          done

      # ============================================================
      # 3. 按矩阵组别动态提取包名
      # ============================================================
      - name: Extract Package List (Filtered)
        id: extract_pkgs
        run: |
          REAL_PKGS=""
          FILTER_PATTERN=""
          GROUP_MATCH="${{ matrix.pkg_match }}"
          
          for dir in */; do
              dir=${dir%/}
              if [ -f "$dir/Makefile" ] && [ "$dir" != "scripts" ] && [ "$dir" != "patches" ]; then
                  
                  # 🌟 矩阵分流逻辑
                  if [ "$GROUP_MATCH" != "others" ]; then
                      # 如果当前是 clashoo 组，只抓 clashoo 相关的包
                      if ! echo "$dir" | grep -iq "$GROUP_MATCH"; then continue; fi
                  else
                      # 如果是 others 组，避开 clashoo 和 openlist2
                      if echo "$dir" | grep -iqE "clashoo|openlist2"; then continue; fi
                  fi
                  
                  REAL_PKGS="$REAL_PKGS $dir"
                  
                  # 提取正则，用于后续过滤
                  FILTER_PATTERN="${FILTER_PATTERN}|${dir}"
                  pkg_name=$(grep -E "^\s*PKG_NAME\s*:?=\s*" "$dir/Makefile" | awk -F'=' '{print $2}' | awk '{print $1}' | tr -d ' "')
                  if [ -n "$pkg_name" ] && [[ "$pkg_name" != *'$('* ]]; then
                      FILTER_PATTERN="${FILTER_PATTERN}|${pkg_name}"
                  fi
                  sub_pkgs=$(grep -E "^\s*define Package/" "$dir/Makefile" | awk -F'/' '{print $2}' | tr -d ' ')
                  for sub in $sub_pkgs; do
                      if [ -n "$sub" ] && [[ "$sub" != *'$('* ]]; then
                          FILTER_PATTERN="${FILTER_PATTERN}|${sub}"
                      fi
                  done
              fi
          done
          
          REAL_PKGS=$(echo $REAL_PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')
          FILTER_PATTERN=${FILTER_PATTERN#|}
          
          echo "🎯 [${{ matrix.group }}] 准备编译的包: $REAL_PKGS"
          echo "PKGS_LIST=$REAL_PKGS" >> $GITHUB_ENV
          echo "DYNAMIC_PATTERN=$FILTER_PATTERN" >> $GITHUB_ENV

      # ============================================================
      # 🌟 提速：各类缓存 (使用 matrix.group 隔离缓存防冲突)
      # ============================================================
      - name: Prepare Cache Directories
        run: mkdir -p cache/dl cache/build_dir cache/staging_dir

      - name: Cache OpenWrt dl
        uses: actions/cache@v4
        with:
          path: cache/dl
          key: openwrt-dl-${{ matrix.group }}-${{ hashFiles('packages.list') }}
          restore-keys: openwrt-dl-${{ matrix.group }}-

      - name: Cache OpenWrt build_dir
        uses: actions/cache@v4
        with:
          path: cache/build_dir
          key: openwrt-build-${{ matrix.group }}-${{ hashFiles('packages.list') }}
          restore-keys: openwrt-build-${{ matrix.group }}-

      - name: Cache OpenWrt staging_dir
        uses: actions/cache@v4
        with:
          path: cache/staging_dir
          key: openwrt-staging-${{ matrix.group }}-${{ hashFiles('packages.list') }}
          restore-keys: openwrt-staging-${{ matrix.group }}-

      # 缓存 Go 和 Rust 编译缓存（巨幅加速 clashoo 和 openlist2）
      - name: Cache Go Modules & Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: lang-cache-${{ matrix.group }}-${{ github.sha }}
          restore-keys: lang-cache-${{ matrix.group }}-

      # ============================================================
      # 4. 调用 Docker SDK Action
      # ============================================================
      - name: Build Packages via Docker
        uses: ilxp/openwrt-gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          PACKAGES: ${{ env.PKGS_LIST }}
          NO_REFRESH_CHECK: true

      # ============================================================
      # 5. 🎯 精准提取产物
      # ============================================================
      - name: Collect Artifacts
        run: |
          mkdir -p output
          for apk in bin/packages/x86_64/packages_ci/*.apk; do
              [ -e "$apk" ] || continue
              filename=$(basename "$apk")
              if echo "$filename" | grep -qE "(${{ env.DYNAMIC_PATTERN }})"; then
                  if echo "$filename" | grep -q "luci-i18n"; then
                      if ! echo "$filename" | grep -qE "zh-cn|zh-tw"; then continue; fi
                  fi
                  cp "$apk" output/
              fi
          done
          ls -lh output/

      # ============================================================
      # 6. 上传 Artifact 供发布阶段使用
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.group }}
          path: output/*.apk
          if-no-files-found: warn # 空包不报错

  # ============================================================
  # 🌟 独立发布 Job (等所有编译组跑完，统一发布，避免并发冲突)
  # ============================================================
  release:
    name: Release Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Files
        run: ls -lh artifacts/

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "x86-64-apks-v3"
          name: "OprX 专属库 (x86_64)-3"
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true