name: Build APKs (Dynamic Fetch & SDK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. 临时拉取源码
      # ============================================================
      - name: Fetch Source Code
        run: |
          chmod +x scripts/fetch-src.sh
          ./scripts/fetch-src.sh

      # ============================================================
      # 3. 源码归位 & 智能展平
      # ============================================================
      - name: Prepare Source for SDK Action
        run: |
          mv package/custom/* ./ || true
          rm -rf package
          
          # 自动展平：如果某个文件夹里只有同名子文件夹且有 Makefile，就提出来
          for dir in */; do
              dir=${dir%/}
              if [ -d "$dir/$dir" ] && [ ! -f "$dir/Makefile" ]; then
                  echo "发现嵌套结构: $dir/$dir -> 正在展平"
                  mv "$dir/$dir"/* "$dir/" 2>/dev/null || true
                  rm -rf "$dir/$dir"
              fi
          done

      # ============================================================
      # 4. 🌟 动态提取包名列表 (供编译使用)
      # ============================================================
      - name: Extract Package List
        id: extract_pkgs
        run: |
          REAL_PKGS=""
          for dir in */; do
              dir=${dir%/}
              if [ -f "$dir/Makefile" ] && [ "$dir" != "scripts" ] && [ "$dir" != "patches" ]; then
                  REAL_PKGS="$REAL_PKGS $dir"
              fi
          done
          
          REAL_PKGS=$(echo $REAL_PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "======================================================"
          echo "🎯 准备编译的源码包名: $REAL_PKGS"
          echo "======================================================"
          echo "PKGS_LIST=$REAL_PKGS" >> $GITHUB_ENV

      # ============================================================
      # 5. 调用 Docker SDK Action (去掉了详细日志 V: s，太卡了)
      # ============================================================
      - name: Build Packages via Docker
        uses: ilxp/openwrt-gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          PACKAGES: ${{ env.PKGS_LIST }}
          NO_REFRESH_CHECK: true

      # ============================================================
      # 6. 🎯 核心：白名单正则过滤 (剔除几百个依赖包)
      # ============================================================
      - name: Create compress files
        run: |
          mkdir -p output
          echo "==> 正在精准提取属于我们的 APK..."
          
          # 构造白名单正则（匹配包名包含以下任意关键字的文件）
          # 这个正则匹配你所有的自建包名称，不管目录叫什么，只要产物带这些关键字就保留
          KEEP_PATTERN="(iqos|admask|controlplus|onup|argon|clashoo|mosdns|qosmate|oaf|wrtbwmon|openlist2|podman|bandix|taskplan|partexp|usb-printer|vlmcsd|ramfree|zerotier|flowcone|nat6)"
          
          for apk in bin/packages/x86_64/packages_ci/*.apk; do
              [ -e "$apk" ] || continue
              filename=$(basename "$apk")
              
              # 使用正则匹配，只要包含关键字，就复制过去
              if echo "$filename" | grep -qE "$KEEP_PATTERN"; then
                  cp "$apk" output/
                  echo "  ✓ $filename"
              fi
          done
          
          echo "======================================================"
          echo "提取完成！最终需要发布的 APK 数量: $(ls -1 output/*.apk 2>/dev/null | wc -l)"
          echo "======================================================"

      # ============================================================
      # 7. 打包与发布
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OprX-Packages-x86_64
          path: output/*.apk

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "x86-64-apks-v3" # 换了新标签，免得跟之前的混在一起
          name: "OprX 专属库 (x86_64)-3"
          files: output/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true