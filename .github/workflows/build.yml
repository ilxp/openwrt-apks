name: Build APKs (Dynamic Fetch & SDK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. 临时拉取源码
      # ============================================================
      - name: Fetch Source Code
        run: |
          chmod +x scripts/fetch-src.sh
          ./scripts/fetch-src.sh

      # ============================================================
      # 2. 现场执行魔改（把你 Update PKG 里的补丁命令贴到这里）
      # ============================================================
      - name: Apply Patches & Modifications
        run: |
          # 例如：
          # sed -i '/AUTOLOAD/d' ./package/custom/shortcut-fe/shortcut-fe/Makefile
          # patch -l -p0 < patches/OpenAppFilter-disable-auto-load-engine.patch
          echo "魔改完成！"

      # ============================================================
      # 3. 源码归位 & 智能展平 (解决嵌套文件夹问题)
      # ============================================================
      - name: Prepare Source for SDK Action
        run: |
          mv package/custom/* ./ || true
          rm -rf package

          # 暴力展平 honk
          if [ -d "luci-app-honk" ]; then
              echo "=== 展平 honk 目录 ==="
              [ -d "luci-app-honk/honk" ] && mv "luci-app-honk/honk" ./honk
              [ -d "luci-app-honk/luci-app-honk" ] && mv "luci-app-honk/luci-app-honk" ./luci-app-honk-ui && mv "luci-app-honk-ui" "./luci-app-honk" || true
              rm -rf "luci-app-honk/honk" 2>/dev/null || true
              if [ -d "luci-app-honk" ] && [ ! -f "luci-app-honk/Makefile" ]; then rm -rf "luci-app-honk"; fi
          fi

          echo "🔍 检查 honk 源码："
          ls -la honk/Makefile

      # ============================================================
      # 4. 🌟 核心：动态扫描根目录，自动生成包名列表！
      # ============================================================
      - name: Extract Package List
        id: extract_pkgs
        run: |
          REAL_PKGS=""
          # 遍历根目录下的所有文件夹
          for dir in */; do
              dir=${dir%/}
              # 排除 .github、scripts 等非源码目录，如果里面有 Makefile 就是我们要的包
              if [ -f "$dir/Makefile" ] && [ "$dir" != "scripts" ] && [ "$dir" != "patches" ]; then
                  REAL_PKGS="$REAL_PKGS $dir"
              fi
          done
          
          REAL_PKGS=$(echo $REAL_PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')
          echo "======================================================"
          echo "🎯 动态提取到的真实包名: $REAL_PKGS"
          echo "======================================================"
          echo "PKGS_LIST=$REAL_PKGS" >> $GITHUB_ENV

      # ============================================================
      # 5. 调用 Docker SDK Action
      # ============================================================
      - name: Build Packages via Docker
        uses: ilxp/openwrt-gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          # 👇 直接使用上一步动态提取出来的环境变量！
          PACKAGES: ${{ env.PKGS_LIST }}
          NO_REFRESH_CHECK: true
          V: s

      # ============================================================
      # 6. 打包产物并发布
      # ============================================================
      - name: Create compress files
        run: |
          ls -la bin/packages/x86_64/
          tar -zcvf OprX-Packages-x86_64.tar.gz -C bin/packages/x86_64/ packages_ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OprX-Packages-x86_64
          path: "OprX-Packages-x86_64.tar.gz"

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "x86-64-apks-v2"
          name: "OprX 专属库 (x86_64)-2"
          files: OprX-Packages-x86_64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true