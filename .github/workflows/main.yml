name: Build APKs (x86_64 Native)

on:
  workflow_dispatch:
  #push:
    #paths:
      #- 'packages.list'

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64 Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. 准备 honk 的特种工具链
      # ============================================================
      - name: Resolve honk toolchain versions
        id: honk-toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/QiuSimons/luci-app-honk /tmp/luci-app-honk
          . /tmp/luci-app-honk/honk/honk_toolchain.sh
          echo "zig_version=${ZIG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bpf_linker_version=${BPF_LINKER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bpf_linker_sha256=${BPF_LINKER_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Download and extract Zig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          V="${{ steps.honk-toolchain.outputs.zig_version }}"
          echo "准备下载 Zig ${V}..."

          # 1. 通过官方 index.json 查找真实的下载链接
          URL=$(curl -fsSL "https://ziglang.org/download/index.json" | jq -r --arg v "$V" '.[$v]."x86_64-linux".tarball // empty' || true)
          
          # 2. 如果没有找到，尝试去 v 前缀
          if [ -z "$URL" ] && [[ "$V" == v* ]]; then
            URL=$(curl -fsSL "https://ziglang.org/download/index.json" | jq -r --arg v "${V#v}" '.[$v]."x86_64-linux".tarball // empty' || true)
          fi

          # 3. 兜底拼凑
          if [ -z "$URL" ]; then
            CLEAN_V="${V#v}"
            URL="https://ziglang.org/download/${CLEAN_V}/zig-x86_64-linux-${CLEAN_V}.tar.xz"
          fi

          echo "最终解析到的下载地址: $URL"
          curl -fsSL -o /tmp/zig.tar.xz "$URL"

          # 4. 解压并重命名目录
          tar -xf /tmp/zig.tar.xz -C tools/
          EXTRACTED_DIR=$(find tools -maxdepth 1 -type d -name "zig-*" ! -name "zig" | head -n 1)
          if [ -n "$EXTRACTED_DIR" ] && [ "$EXTRACTED_DIR" != "tools/zig" ]; then
              mv "$EXTRACTED_DIR" tools/zig
          fi
          ./tools/zig/zig version

      - name: Download bpf-linker
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.honk-toolchain.outputs.bpf_linker_version }}"
          SHA="${{ steps.honk-toolchain.outputs.bpf_linker_sha256 }}"
          curl -fsSL -o /tmp/bpf-linker.tar.zst "https://github.com/aya-rs/bpf-linker/releases/download/v${V}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${SHA}  /tmp/bpf-linker.tar.zst" | sha256sum -c -
          tar --zstd -xf /tmp/bpf-linker.tar.zst -C tools/
          chmod +x tools/bpf-linker

      # ============================================================
      # 2. 安装宿主机的编译环境
      # ============================================================
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc wget unzip python3 zstd rsync file

      # ============================================================
      # 3. 准备源码到 package 目录
      # ============================================================
      - name: Fetch Source Code
        run: |
          chmod +x scripts/fetch-src.sh
          ./scripts/fetch-src.sh

      # ============================================================
      # 4. 从 packages.list 提取包名
      # ============================================================
      - name: Extract Package List
        id: extract_pkgs
        run: |
          PKGS=""
          while IFS='|' read -r line; do
              [[ -z "$line" || "$line" == \#* ]] && continue
              IFS='|' read -ra parts <<< "$line"
              if [ "${parts[0]}" == "full" ]; then
                  PKGS="$PKGS ${parts[1]}"
              elif [ "${parts[0]}" == "sparse" ]; then
                  for ((i=4; i<${#parts[@]}; i++)); do
                      PKGS="$PKGS $(basename "${parts[$i]}")"
                  done
              fi
          done < packages.list
          FINAL_PKGS=$(echo "$PKGS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          echo "解析出的包: $FINAL_PKGS"
          echo "PKGS_LIST=$FINAL_PKGS" >> $GITHUB_ENV

      # ============================================================
      # 5. 下载 SDK 并编译 (完全摒弃 Docker)
      # ============================================================
      - name: Build Packages
        env:
          SDK_VER: "25.12.2"
        run: |
          set -euo pipefail
          
          # ★ 核心修复：保留系统默认环境，只把我们的工具追加进去
          export PATH="${{ github.workspace }}/tools:${{ github.workspace }}/tools/zig:$PATH"
          
          echo "==> 下载 ImmortalWrt SDK..."
          SDK_URL="https://downloads.immortalwrt.org/releases/${SDK_VER}/targets/x86/64/immortalwrt-sdk-${SDK_VER}-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          
          # 此时 wget 已经可以正常找到了
          wget -q "$SDK_URL" -O sdk.tar.zst
          
          echo "==> 解压 SDK..."
          tar --zstd -xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk
          cd sdk
          
          echo "==> 更新基础 Feeds..."
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          echo "==> 安装 Go 编译环境..."
          ./scripts/feeds install golang
          
          echo "==> 拷贝自定义源码到 SDK 中..."
          mkdir -p package/custom
          cp -r ../package/custom/* package/custom/
          
          echo "==> 开始编译..."
          make defconfig
          
          # 暴力循环编译所有解析出来的包
          for pkg in ${{ env.PKGS_LIST }}; do
              echo "================ 正在编译 $pkg ================"
              make package/custom/$pkg/compile V=s -j$(nproc) || echo "⚠️ $pkg 编译失败，跳过"
          done
          
      # ============================================================
      # 6. 收集并发布
      # ============================================================
      - name: Collect and Release
        run: |
          mkdir -p output
          echo "==> 正在从 package/custom 精准提取我们的自建包..."

          # ★ 核心修复：遍历我们自己的源码目录，利用目录名和 Makefile 里的 PKG_NAME 进行精准匹配
          for dir in sdk/package/custom/*/; do
              [ -d "$dir" ] || continue
              dir_name=$(basename "$dir")
              
              # 1. 尝试用文件夹名匹配 apk (比如 luci-app-honk, luci-theme-argon)
              find sdk/bin/packages -type f -name "${dir_name}*.apk" -exec cp {} output/ \; 2>/dev/null || true
              
              # 2. 尝试从 Makefile 中提取真实的 PKG_NAME 匹配 (解决 OpenAppFilter 这种文件夹名和包名不同的情况)
              if [ -d "$dir" ]; then
                  find "$dir" -name "Makefile" | while read -r mf; do
                      pkg_names=$(grep "^PKG_NAME:=" "$mf" | awk -F'=' '{print $2}' | tr -d ' ')
                      for pkg_name in $pkg_names; do
                          # 如果包名和文件夹名不一样，再抓一次
                          if [ "$pkg_name" != "$dir_name" ]; then
                              find sdk/bin/packages -type f -name "${pkg_name}*.apk" -exec cp {} output/ \; 2>/dev/null || true
                          fi
                      done
                  done
              fi
          done
          
          # 去除可能因为软链接或其他原因产生的重复文件
          find output/ -type l -delete
          
          echo "精准提取完成！共拿到 $(ls -1 output/*.apk 2>/dev/null | wc -l) 个属于我们自己的 APK 文件："
          ls -lh output/
          
          # 顺便打个压缩包（可选）
          if ls output/*.apk >/dev/null 2>&1; then
            cd output
            tar -zcvf OprX-x86_64-apks.tar.gz *.apk
          fi

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "x86-64-apks"
          name: "OprX 专属库 (x86_64)"
          files: output/*
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true
